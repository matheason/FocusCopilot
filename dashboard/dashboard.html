<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusCopilot - 专注数据看板</title>
    <link rel="stylesheet" href="dashboard.css">
    <!-- 引入 Chart.js 用于渲染图表 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
    <!-- 顶栏 -->
    <header class="navbar">
        <div class="brand">
            <span class="logo">🚀</span>
            <h1>FocusCopilot 数据看板</h1>
        </div>
        <div class="actions">
            <button id="refresh-btn" class="btn btn-secondary">🔄 刷新数据</button>
            <button id="clear-btn" class="btn btn-danger">🗑️ 清空记录</button>
        </div>
    </header>

    <!-- 顶部概览卡片组 -->
    <div class="metrics-grid">
        <div class="card metric-card">
            <div class="metric-icon" style="background: #e0e7ff; color: #4f46e5;">⏱️</div>
            <div class="metric-info">
                <span class="metric-label">今日浏览总时长</span>
                <h2 id="total-time" class="metric-value">0 秒</h2>
            </div>
        </div>
        <div class="card metric-card">
            <div class="metric-icon" style="background: #fce7f3; color: #ec4899;">🌐</div>
            <div class="metric-info">
                <span class="metric-label">已访问站点数</span>
                <h2 id="total-sites" class="metric-value">0</h2>
            </div>
        </div>
        <div class="card metric-card">
            <div class="metric-icon" style="background: #fef3c7; color: #d97706;">👑</div>
            <div class="metric-info">
                <span class="metric-label">最常访问网站</span>
                <h2 id="top-site" class="metric-value">-</h2>
            </div>
        </div>
    </div>

    <!-- 主体区域：图表 + 排行榜 -->
    <div class="main-content">
        <!-- 图表区域 -->
        <div class="card chart-section">
            <h3>📊 网站时间分布图</h3>
            <div class="chart-container">
                <canvas id="timeChart"></canvas>
            </div>
        </div>

        <!-- 数据列表区域 -->
        <div class="card list-section">
            <h3>🏆 网站耗时排行榜</h3>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>域名</th>
                        <th>耗时</th>
                        <th>占比</th>
                    </tr>
                    </thead>
                    <tbody id="table-body">
                    <tr>
                        <td colspan="3" class="empty-cell">加载中...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
